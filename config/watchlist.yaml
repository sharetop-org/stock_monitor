# ======== 自选股清单 ========
# ts_code 格式: 6位代码 + 交易所后缀 (.SH/.SZ/.BJ)
# 参考代码: 600519.SH 贵州茅台 | 300059.SZ 东方财富 | 000001.SZ 平安银行
symbols:
  - "601717.SH"   #中创智领
  - "300059.SZ"   #东方财富
  - "600036.SH"   #招商银行
  - "600054.SH"   #黄山旅游
  - "603195.SH"   #公牛集团
  - "600377.SH"   #宁沪高速
  - "000333.SZ"   #美的集团
  - "002594.SZ"   #比亚迪
  - "600809.SH"   #山西汾酒

# 每个交易标的可叠加一个购买策略与一组预警规则（可作为全局的覆盖）。
# 若某标的未声明，则回退到全局 strategies.yaml / alerts.yaml 配置。
#
# 「N日新低监测」（low-alert）可为每只标的设置各自的观察窗口：
#   low_days: 250          → 监测该股是否触及 250 日低位（单窗口）
#   windows:  [250, 365]   → 同时监测多个窗口, 任一触发即报警
#   未配置（或在下方 flat `symbols:` 列表里）→ 默认 1250（约5年×250交易日）。
#
# 结构示例（可留空）：
#   - name: 贵州茅台
#     ts_code: 600519.SH
#     buy_goal: 1800          # 买入目标价
#     sell_goal: 2100         # 卖出参考价
#     low_days: 250           # N日新低监测窗口（交易日天数），可选，缺省 1250
# 示例：这里用三种典型写法演示每股各自的新低监测窗口
stocks:
  - name: 招商银行
    ts_code: 600036.SH        # 未配置窗口 → 默认 1250（约5年）
  - name: 黄山旅游
    ts_code: 600054.SH
    low_days: 250             # 单窗口：监测 250 日低位
  - name: 中创智领
    ts_code: 601717.SH      
    low_days: 750
  - name: 公牛集团
    ts_code: 603195.SH        # 未配置窗口 → 默认 1250
  - name: 山西汾酒
    ts_code: 600809.SH        # 未配置窗口 → 默认 1250
  - name: 宁沪高速
    ts_code: 600377.SH        # 未配置窗口 → 默认 1250
    low_days: 750
  - name: 美的集团
    ts_code: 000333.SZ        # 未配置窗口 → 默认 1250
    low_days: 500