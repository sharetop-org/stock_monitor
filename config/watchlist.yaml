# ======== 自选股清单 ========
# ts_code 格式: 6位代码 + 交易所后缀 (.SH/.SZ/.BJ)
# 参考代码: 600519.SH 贵州茅台 | 300059.SZ 东方财富 | 000001.SZ 平安银行
symbols:
  - "601717.SH"   #中创智领
  - "300059.SZ"   #东方财富
  - "600036.SH"   #招商银行
  - "600054.SH"   #黄山旅游
  - "603195.SH"   #公牛集团
  - "600377.SH"   #宁沪高速
  - "000333.SZ"   #美的集团
  - "002594.SZ"   #比亚迪
  - "600809.SH"   #山西汾酒

# 每个交易标的可叠加一个购买策略与一组预警规则（可作为全局的覆盖）。
# 若某标的未声明，则回退到全局 strategies.yaml / alerts.yaml 配置。
# 结构示例（可留空）：
#   - name: 贵州茅台
#     ts_code: 600519.SH
#     buy_goal: 1800          # 买入目标价
#     sell_goal: 2100         # 卖出参考价
stocks:
  - name: 贵州茅台
    ts_code: 600519.SH
  - name: 东方财富
    ts_code: 300059.SZ
  - name: 平安银行
    ts_code: 000001.SZ
  - name: 中创智领
    ts_code: 601717.SH